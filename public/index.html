<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#142c46" />
  <title>우리 학교 얼음땡!</title>
  <link rel="stylesheet" href="/style.css?v=3" />
</head>
<body>
  <div id="app">
    <section id="home" class="screen active">
      <div class="hero-card">
        <div class="eyebrow">실시간 온라인 교실 게임</div>
        <h1>우리 학교 ❄️ 얼음땡!</h1>
        <p>QR로 입장하고 운동장과 5층 학교 건물을 오가며 뛰어다니는 최대 100인 실시간 얼음땡</p>
        <div class="home-actions">
          <button id="teacherCreate" class="primary big">👩‍🏫 교사용 방 만들기</button>
          <button id="studentJoinOpen" class="secondary big">🎒 학생으로 입장</button>
        </div>
        <div class="howto-mini">이동: WASD / 방향키 · 얼음: I · 점프: Space · 붕어빵을 먹으면 10초 부스터 사용 가능</div>
      </div>
    </section>

    <section id="join" class="screen">
      <div class="panel narrow">
        <button class="back" data-back="home">←</button>
        <h2>학생 입장</h2>
        <label>방 코드<input id="joinCode" maxlength="5" placeholder="예: A7K9Q" autocomplete="off" /></label>
        <label>닉네임<input id="nickname" maxlength="12" placeholder="이름 또는 별명" autocomplete="off" /></label>
        <button id="joinBtn" class="primary big">입장하기</button>
        <p id="joinError" class="error"></p>
      </div>
    </section>

    <section id="teacher" class="screen">
      <div class="teacher-layout">
        <aside class="teacher-sidebar panel">
          <div class="eyebrow">교사용 대시보드</div>
          <h2>방 코드 <strong id="roomCodeText">-----</strong></h2>
          <div class="qrbox"><img id="qrImage" alt="학생 입장 QR" /></div>
          <div id="joinUrl" class="join-url"></div>
          <div class="stat-grid">
            <div><b id="teacherPlayers">0</b><span>참가</span></div>
            <div><b id="teacherAlive">0</b><span>도망팀 생존</span></div>
          </div>
          <label>술래 수<input id="taggerCount" type="number" min="1" max="20" value="3" /></label>
          <label>게임 시간
            <select id="durationSec">
              <option value="120">2분</option><option value="180">3분</option><option value="240" selected>4분</option>
              <option value="300">5분</option><option value="420">7분</option><option value="600">10분</option>
            </select>
          </label>
          <button id="saveSettings" class="secondary">설정 저장</button>
          <button id="startGame" class="primary big">게임 시작</button>
          <button id="resetGame" class="danger">새 게임으로 초기화</button>
          <p id="teacherMessage" class="hint"></p>
        </aside>
        <main class="game-wrap teacher-game">
          <canvas id="teacherCanvas"></canvas>
          <div id="teacherTopbar" class="topbar"></div>
          <div id="teacherZoneTabs" class="zone-tabs"></div>
          <div id="activity" class="activity"></div>
        </main>
      </div>
    </section>

    <section id="player" class="screen">
      <div class="game-wrap player-game">
        <canvas id="playerCanvas"></canvas>
        <div id="playerTopbar" class="topbar"></div>
        <div id="roleBadge" class="role-badge">대기 중</div>
        <div id="statusOverlay" class="status-overlay hidden"></div>
        <div id="reconnectBadge" class="reconnect-badge hidden">📶 다시 연결하는 중...</div>
        <div id="mobileControls" class="mobile-controls">
          <div class="dpad">
            <button type="button" data-key="up" aria-label="위로 이동">▲</button>
            <div><button type="button" data-key="left" aria-label="왼쪽으로 이동">◀</button><button type="button" data-key="down" aria-label="아래로 이동">▼</button><button type="button" data-key="right" aria-label="오른쪽으로 이동">▶</button></div>
          </div>
          <div class="action-buttons">
            <button type="button" id="boostBtn" class="boost-btn hidden" aria-label="부스터 사용">⚡<span>부스터</span><small id="boostCount"></small></button>
            <button type="button" id="jumpBtn" class="jump-btn" aria-label="점프">⬆️<span>점프</span></button>
            <button type="button" id="iceBtn" class="ice-btn" aria-label="얼음 하기">❄️<span>얼음!</span></button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="characterModal" class="modal hidden" aria-modal="true" role="dialog">
    <div class="modal-card">
      <h2>내 캐릭터를 골라주세요</h2>
      <p>선택한 모습으로 게임에 참가합니다.</p>
      <div class="character-options">
        <button type="button" class="character-card" data-gender="male"><div class="avatar-preview male">👦</div><b>남자 캐릭터</b></button>
        <button type="button" class="character-card" data-gender="female"><div class="avatar-preview female">👧</div><b>여자 캐릭터</b></button>
      </div>
      <button id="cancelCharacter" class="secondary">취소</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js?v=3"></script>
</body>
</html>
